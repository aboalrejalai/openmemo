# OpenMemo 1-Click Deploy (Hostinger VPS & Docker Compose)
name: openmemo

services:
  openmemo-mcp:
    build:
      context: ./deploy/memo-mcp
      dockerfile: Dockerfile
    image: openmemo-mcp:latest
    platform: linux/amd64
    hostname: openmemo-vps
    ports:
      - "${PORT:-8080}:8080"
    volumes:
      - openmemo_vault:/srv/memo
      - openmemo_proxy:/srv/proxy-data
    environment:
      MEMO_REMOTE: "1"
      MEMO_VAULT: /srv/memo
      MEMO_SYNC_INTERVAL_MINUTES: "${MEMO_SYNC_INTERVAL_MINUTES:-1}"
      MEMO_CREATE_FILL_DELAY: "0"
      PASSWORD: "${PASSWORD:-}"
      EXTERNAL_URL: "${EXTERNAL_URL:-https://localhost:8080}"
      TRUSTED_PROXIES: "${TRUSTED_PROXIES:-}"
      MEMO_REPO_URL: "${MEMO_REPO_URL:-https://github.com/aboalrejalai/openmemo.git}"
      HOME: /tmp
      TZ: "${TZ:-UTC}"
    env_file:
      - path: .env
        required: false
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python3",
          "-c",
          "import socket,sys; s=socket.socket(); s.settimeout(2); r=s.connect_ex(('127.0.0.1',8080)); s.close(); sys.exit(0 if r==0 else 1)",
        ]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 90s

volumes:
  openmemo_vault:
  openmemo_proxy:
